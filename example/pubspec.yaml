name: example
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  adp_desktop:
    path: ../

  url_launcher: ^6.2.5
  custom_text: ^2.0.1
  highlight: ^0.7.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - lib/src/view/screens/home/tabs/icons/
    - lib/src/view/screens/home/tabs/fields/
    - lib/src/view/screens/home/tabs/layouts/
    - lib/src/view/screens/home/tabs/pickers/
    - lib/src/view/screens/home/tabs/buttons/
    - lib/src/view/screens/home/tabs/surfaces/
    - lib/src/view/screens/home/tabs/additional/
    - lib/src/view/screens/home/tabs/indicators/
    - lib/src/view/screens/home/tabs/navigation/

