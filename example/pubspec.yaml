name: example
description: "Demonstrates how to use the adp_desktop package"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  adp_desktop:
    path: ../

  url_launcher: ^6.2.5
  custom_text: ^2.0.1
  highlight: ^0.7.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/banner.png
    - lib/src/view/screens/home/tabs/icons/
    - lib/src/view/screens/home/tabs/fields/
    - lib/src/view/screens/home/tabs/layouts/
    - lib/src/view/screens/home/tabs/pickers/
    - lib/src/view/screens/home/tabs/buttons/
    - lib/src/view/screens/home/tabs/surfaces/
    - lib/src/view/screens/home/tabs/additional/
    - lib/src/view/screens/home/tabs/indicators/
    - lib/src/view/screens/home/tabs/navigation/