name: GH-Pages

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use secrets for token
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2 # Upgrade to v2
        with:
          flutter-version: '2.x' # Specify Flutter version

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ./example

      - name: Build Web
        run: flutter build web --release --source-maps
        working-directory: ./example

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # Use secrets for token
          publish_dir: ./example/build/web
