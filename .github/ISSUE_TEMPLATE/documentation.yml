name: 📝 Documentation Update
description: Report incorrect or missing documentation
title: "[DOCS] "
labels: [documentation]
body:
  - type: textarea
    id: issue
    attributes:
      label: Describe the Documentation Issue
      description: What is unclear, missing, or incorrect?
      placeholder: |
        The docs for XYZ are missing...
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where did you find the issue? (README, API docs, etc.)
      placeholder: |
        Found in README.md section ...

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix or Improvement
      description: How would you improve it?

  - type: textarea
    id: additional
    attributes:
      label: Additional Notes
      description: Add any other context if helpful
