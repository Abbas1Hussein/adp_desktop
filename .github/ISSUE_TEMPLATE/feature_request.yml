name: ✨ Feature Request
description: Suggest a new feature or enhancement for this package
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the new feature you'd like to see
      placeholder: |
        I'd like to have...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature useful or needed?
      placeholder: |
        This would help because...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternatives or workarounds?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add screenshots, mockups, or notes if relevant
